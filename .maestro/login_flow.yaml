appId: com.anonymous.expoweather
tags:
  - subflow
---
# Login screen should already be visible (called after onboarding_flow.yaml).
# Guard with a wait in case JS bundle is still hydrating.
- extendedWaitUntil:
    visible:
      id: 'login-title'
    timeout: 15000

- assertVisible:
    id: 'login-subtitle'
- assertVisible:
    id: 'google-signin-button'
- assertVisible:
    id: 'guest-signin-button'
- tapOn:
    id: 'guest-signin-button'

# Authenticated — Home screen must show the search input.
- assertVisible:
    id: 'search-input'
