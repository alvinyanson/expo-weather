appId: com.anonymous.expoweather
---
# Reach the authenticated Home screen via onboarding → login.
- runFlow: onboarding_flow.yaml
- runFlow: login_flow.yaml

# details-hint may be off-screen on smaller devices — scroll to it before tapping.
- scrollUntilVisible:
    element:
      id: 'details-hint'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'current-weather'

# Details renders once weather is ready.
- extendedWaitUntil:
    visible:
      id: 'daily-forecast'
    timeout: 30000

# Header
- assertVisible:
    id: 'back-button'
- assertVisible:
    id: 'details-city'
- assertVisible:
    id: 'details-share-button'
- assertVisible:
    id: 'details-save-button'
- assertVisible:
    id: 'last-updated'

# Summary card
- assertVisible:
    id: 'weather-summary-card'
- assertVisible:
    id: 'detail-humidity'
- assertVisible:
    id: 'detail-wind'
- assertVisible:
    id: 'detail-uv-index'

# Forecast list
- assertVisible:
    id: 'daily-forecast'
- assertVisible:
    id: 'details-history-button'

# Back navigation returns to Home.
- tapOn:
    id: 'back-button'
- assertVisible:
    id: 'search-input'
